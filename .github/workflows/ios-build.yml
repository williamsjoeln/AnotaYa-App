# AnotaYa iOS automated build & TestFlight release (v1.0.0-build.4)
name: Build iOS App (App Store & TestFlight)

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload directly to App Store Connect / TestFlight'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'ios/**'
      - '.github/**'

jobs:
  build:
    name: Build & Package iOS App (AnotaYa)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install web dependencies
        run: npm ci

      - name: ⚡ Build Vite production bundle
        run: npm run build

      - name: 🔄 Sync Capacitor iOS project
        run: npx cap sync ios

      - name: 🔐 Install Apple Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'build123' }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "Installing Apple Certificate..."
            export CERT_PATH=$RUNNER_TEMP/build_certificate.p12
            export PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            python3 .github/scripts/ios_install_cert.py

            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | sed -e 's/"//g')

            # Extract UUID and copy profile
            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $PP_PATH) 2>/dev/null || echo "6acdaa62-91b2-4a90-b155-b46f0a888c8d")
            echo "Provisioning Profile UUID: $PROFILE_UUID"
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/6acdaa62-91b2-4a90-b155-b46f0a888c8d.mobileprovision
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/"AnotaYa AppStore.mobileprovision"
            if [ -n "$PROFILE_UUID" ]; then
              cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
            fi
            echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
            echo "✅ Certificate and Provisioning Profile installed successfully!"
          else
            echo "⚠️ No signing certificate found in secrets, continuing in ad-hoc/automatic signing mode."
          fi

      - name: 🔨 Build iOS Archive (.xcarchive)
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: |
          set -o pipefail
          mkdir -p build
          ARCHIVE_PATH="$(pwd)/build/App.xcarchive"
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET_FLAG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_FLAG="-project ios/App/App.xcodeproj"
          fi

          if [ -n "$HAS_CERT" ]; then
            echo "Building with Apple Code Signing for Team H79W4YK96D..."
            xcodebuild archive \
              $TARGET_FLAG \
              -scheme App \
              -destination "generic/platform=iOS" \
              -configuration Release \
              -archivePath "$ARCHIVE_PATH" \
              DEVELOPMENT_TEAM=H79W4YK96D \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              2>&1 | tee xcodebuild.log || (echo "::error::Xcode build failed. Checking errors:" && grep -i "error:" xcodebuild.log -A 2 -B 1 | head -n 30 && tail -n 50 xcodebuild.log && exit 65)
          else
            echo "Building unsigned/ad-hoc for iOS package..."
            xcodebuild archive \
              $TARGET_FLAG \
              -scheme App \
              -destination "generic/platform=iOS" \
              -configuration Release \
              -archivePath "$ARCHIVE_PATH" \
              CODE_SIGN_ALLOWED=NO \
              CODE_SIGN_REQUIRED=NO
          fi

      - name: 📦 Package .ipa file
        run: |
          python3 .github/scripts/package_ipa.py

      - name: 🚀 Upload directly to App Store Connect / TestFlight
        if: ${{ github.event_name == 'push' || github.event.inputs.upload_to_testflight != 'false' }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          if [ -z "$KEY_CONTENT" ]; then
            echo "⚠️ No App Store Connect API Key found in secrets. Skipping TestFlight upload."
            exit 0
          fi

          echo "🔑 Setting up App Store Connect API Key..."
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

          echo "🔍 Validating IPA with Apple App Store Connect..."
          xcrun altool --validate-app -f build/AnotaYa.ipa -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" --show-progress

          echo "🚀 Uploading IPA to Apple App Store Connect..."
          xcrun altool --upload-app -f build/AnotaYa.ipa -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" --show-progress
          echo "🎉 Successfully uploaded AnotaYa to App Store Connect / TestFlight!"

      - name: 💾 Save IPA as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnotaYa-iOS-App
          path: build/AnotaYa.ipa
          retention-days: 14

      - name: 🚀 Publish GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AnotaYa iOS v1.0 (Build ${{ github.run_number }})
          body: |
            ### 📱 AnotaYa iOS Build ${{ github.run_number }}
            Archivo de instalación oficial para iPhone (iOS):
            - **Archivo**: `AnotaYa.ipa`
            - **Bundle ID**: `com.anotaya.app`
            - **Plataforma**: iOS (Apple App Store / TestFlight)
          files: build/AnotaYa.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
